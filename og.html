<!doctype html>
<html lang="zh-CN">
  <head>

      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #090c09; }
      .og {
        position: relative;
        width: 1200px;
        height: 630px;

          radial-gradient(ellipse 40% 35% at 84% 12%, rgba(236, 97, 61, .1), transparent 70%),

        font-family: 'Newsreader', 'Songti SC', 'SimSun', Georgia, serif;
      }
      .contours { position: absolute; inset: 0; width: 100%; height: 100%; }
      .rail {
        position: absolute;
        inset: 34px 40px;
        border: 1px solid rgba(200, 185, 155, .2);
      }
      .top {
        position: absolute;
        left: 64px;
        top: 56px;
        display: flex;
        gap: 18px;
        align-items: center;
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 11px;
        letter-spacing: .16em;
        color: #c8b99b;
      }
      .dot { width: 6px; height: 6px; border-radius: 50%; background: #ec613d; }
      .eyebrow { position: absolute; left: 64px; top: 158px; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; letter-spacing: .14em; color: rgba(241, 234, 217, .48); text-transform: uppercase; }
      h1 {
        position: absolute;
        left: 58px;
        top: 204px;
        margin: 0;
        width: 950px;
        font-size: 92px;
        font-weight: 300;
        line-height: 1.05;
        letter-spacing: -.065em;
      }
      h1 span { display: block; }
      h1 span:last-child { color: #c8b99b; margin-left: 46px; }
      h1 em { color: #ec613d; font-style: normal; }
      .lede {
        position: absolute;
        left: 64px;
        bottom: 88px;
        width: 520px;
        padding-left: 18px;
        border-left: 1px solid rgba(200, 185, 155, .3);
        color: rgba(241, 234, 217, .56);
        font-family: 'Space Grotesk', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        line-height: 1.8;

      .meta {

        bottom: 88px;

      .meta strong { color: #f1ead9; font-weight: 400; }
      .bottom {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 39px;
        display: flex;
        justify-content: space-between;
        padding-top: 12px;
        border-top: 1px solid rgba(200, 185, 155, .2);
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 9px;
        letter-spacing: .12em;
        color: rgba(200, 185, 155, .46);
        text-transform: uppercase;
